<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index — fog and order</title>

  <style>
:root {
  --bg: #d6d9df;
  --ink: #0f1722;
  --ink-soft: rgba(15, 23, 34, 0.55);
  --border: rgba(15, 23, 34, 0.14);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.4;
  letter-spacing: 0.2px;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* NAV */

.nav {
  position: fixed;
  top: 18px;
  right: 32px;

  display: flex;
  gap: 28px;

  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: lowercase;
}

.nav a {
  color: var(--ink);
  text-decoration: none;
  opacity: 0.9;
  transition: opacity 0.2s ease;
}

.nav a:hover {
  opacity: 0.5;
}

/* INDEX */

.index-page {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 120px 24px 80px;
}

.index-container {
  width: 100%;
  max-width: 760px;

  display: flex;
  flex-direction: column;
  gap: 18px;
}

.index-heading {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: lowercase;
  color: var(--ink-soft);

  margin-bottom: 12px;
}

/* ITEMS */

.index-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;

  padding: 14px 0;

  border-top: 1px solid var(--border);

  text-decoration: none;
  color: var(--ink);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
}

.index-item:last-child {
  border-bottom: 1px solid var(--border);
}

.index-item:hover {
  opacity: 0.6;
  transform: translateX(2px);
}

.title {
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.5px;
  text-transform: lowercase;
}

.year {
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: lowercase;
  color: var(--ink-soft);
}

/* MOBILE */

@media (max-width: 640px) {

  .nav {
    right: 20px;
    gap: 18px;
    font-size: 11px;
  }

  .index-item {
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }

  .title {
    font-size: 18px;
  }
}
  </style>
</head>

<body>

  <nav class="nav">
    <a href="../index.html">home</a>
    <a href="../about.html">about</a>
    <a href="../reading_list.html">reading</a>

  </nav>

  <section class="index-page">
    <div class="index-container">

      <div class="index-heading">
        archive / studies
      </div>

      <a class="index-item" href="coastal entropy: fort bragg.html">
        <span class="title">coastal entropy: fort bragg</span>
        <span class="year">2026</span>
      </a>

      <a class="index-item" href="catalan_coastal_light.html">
        <span class="title">catalan coastal light</span>
        <span class="year">2024</span>
      </a>

      <a class="index-item" href="natural-history-museum-london.html">
        <span class="title">natural history museum, london</span>
        <span class="year">2024</span>
      </a>

    </div>
  </section>

</body>
</html>
